name: CrypticGate CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    name: Compile Compact Contracts & Run ZK Test Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Workspace & Subfolder Dependencies
        run: |
          npm install
          npm --prefix contract install
          npm --prefix frontend install
          npm --prefix indexer install

      - name: Compile Compact ZK Smart Contracts
        run: |
          npm run compile:contract

      - name: Execute Vitest ZK Prover & Preprod E2E Test Suite (14 Tests)
        run: npm test

      - name: Build All Production Workspaces (Contract, Frontend, Indexer)
        run: npm run build
