name: CrypticGate CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    name: Compile Contracts & Run ZK Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Workspace & Subfolder Dependencies
        run: |
          npm install
          npm --prefix contract install
          npm --prefix frontend install
          npm --prefix indexer install

      - name: Execute Vitest ZK Membership Unit Test Suite
        run: npm test

      - name: Build All Workspaces (Contract, Frontend, Indexer)
        run: npm run build
