name: CrypticGate CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    name: Compile Contracts & Run ZK Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Typecheck Workspace
        run: npx tsc --noEmit

      - name: Build Contract & Frontend Bundles
        run: npm run build

      - name: Execute Vitest ZK Membership Unit Test Suite
        run: npm test

      - name: Verify Indexer Service
        run: npm --prefix indexer build
